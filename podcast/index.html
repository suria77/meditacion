<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dharma Eterno - Reproductor</title>
    <!-- Fuentes: Cormorant Garamond, Cinzel, Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Cinzel:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: url("/assets/img/fondo.webp") no-repeat center center fixed;
            background-size: cover;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #f3e9d2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
        }

        .container {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-text {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 2.3rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-align: center;
            white-space: nowrap;
            background: linear-gradient(180deg, #fff2c6 0%, #d8b25d 50%, #9e782f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.7));
            margin-bottom: 14px;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 0.82rem;
            font-weight: 400;
            letter-spacing: 5px;
            color: #ffffff;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 18px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
            opacity: 0.9;
        }

        .player-wrapper {
            width: 100%;
            position: relative;
            background: url("/assets/player/cajetin.png") no-repeat center center;
            background-size: 100% 100%;
            padding: 30px 35px 25px 35px;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: box-shadow 0.4s ease;
        }

        .player-wrapper.playing {
            box-shadow: 0 0 25px rgba(226, 190, 110, 0.3), 0 15px 35px rgba(0,0,0,0.7);
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            margin-bottom: 20px;
            max-height: 240px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .episodes-grid::-webkit-scrollbar {
            width: 5px;
        }
        .episodes-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .episodes-grid::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.5);
            border-radius: 10px;
        }

        /* Fila de Episodio */
        .episode-item {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 16px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
            overflow: hidden;
            user-select: none;
            touch-action: pan-y;
        }

        .episode-progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, rgba(112, 48, 160, 0.65) 0%, rgba(155, 81, 224, 0.5) 100%);
            pointer-events: none;
            transition: width 0.1s linear;
            z-index: 1;
            border-radius: 30px 0 0 30px;
        }

        .episode-item:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .episode-item.active {
            background: rgba(212, 175, 55, 0.18);
            border: 1px solid rgba(212, 175, 55, 0.5);
        }

        .episode-info, .episode-duration {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .episode-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.92rem;
            color: #f0e6d2;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .episode-duration {
            font-size: 0.85rem;
            color: #d1c29b;
            font-weight: 400;
            margin-left: 10px;
        }

        /* Icono pequeño con zona táctil interactiva */
        .icon-btn-small {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex-shrink: 0;
            pointer-events: auto; /* Permite clic/touch directo */
            cursor: pointer;
            padding: 2px;
            z-index: 3;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 5px;
            padding: 0 10px;
        }

        .volume-container {
            width: 250px;
            display: flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .volume-icon {
            width: 20px;
            height: 20px;
            fill: #e2be6e;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .volume-icon:hover {
            transform: scale(1.1);
        }

        .volume-bar {
            width: 100%;
            height: 12px;
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        .volume-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            position: relative;
        }

        .volume-fill {
            height: 100%;
            background: linear-gradient(90deg, #b3922f, #f3e09b);
            width: 100%;
            position: relative;
            border-radius: 2px;
            pointer-events: none;
        }

        .volume-knob {
            width: 12px;
            height: 12px;
            background: #f3e09b;
            border-radius: 50%;
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 0 6px rgba(212, 175, 55, 0.9);
        }

        .controls-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
        }

        .btn-img-control {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            position: relative;
            transition: transform 0.2s ease;
        }

        .btn-img-control:hover {
            transform: scale(1.1);
        }

        .img-nav {
            height: 32px;
            width: auto;
        }

        .img-main-play {
            height: 74px;
            width: auto;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
        }

        .play-glow-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 230, 150, 0.9) 0%, rgba(212, 175, 55, 0.5) 40%, rgba(0, 0, 0, 0) 75%);
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        .btn-img-control.trigger-flash .play-glow-effect {
            animation: flashPulseThreeTimes 1.2s ease-in-out 3 forwards;
        }

        @keyframes flashPulseThreeTimes {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.2; }
            50% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
        }

        .footer-branding {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .micro-img {
            width: 230px;
            height: auto;
            filter: drop-shadow(0 6px 15px rgba(0,0,0,0.6));
        }

        @media (max-width: 768px) {
            .title-text { font-size: 1.35rem; margin-bottom: 10px; }
            .episodes-grid { grid-template-columns: 1fr; }
            .player-wrapper { background-size: cover; padding: 20px; }
            .volume-container { width: 130px; }
            .img-main-play { height: 58px; }
            .img-nav { height: 26px; }
            .micro-img { width: 170px; }
        }
    </style>
</head>
<body>

    <audio id="mainAudio" src="/podcast/audio/1-el-comienzo-del-camino.mp3"></audio>

    <div class="container">
        <h1 class="title-text">¿Quieres aprender de forma cómoda?</h1>
        <div class="subtitle">TU ESPACIO DE CONOCIMIENTO</div>

        <div class="player-wrapper" id="playerWrapper">
            <div class="episodes-grid" id="episodesList">

                <div class="episode-item active" data-index="0">
                    <div class="episode-progress-fill" id="progress-0"></div>
                    <div class="episode-info">
                        <img src="/assets/player/playpeq.png" class="icon-btn-small" id="icon-ep-0" alt="play" onclick="onSmallIconClick(event, 0)">
                        <span>1. El comienzo del camino</span>
                    </div>
                    <span class="episode-duration">4:53</span>
                </div>

                <div class="episode-item" data-index="1">
                    <div class="episode-progress-fill" id="progress-1"></div>
                    <div class="episode-info">
                        <img src="/assets/player/playpeq.png" class="icon-btn-small" id="icon-ep-1" alt="play" onclick="onSmallIconClick(event, 1)">
                        <span>2. La meditación en la vida real</span>
                    </div>
                    <span class="episode-duration">5:17</span>
                </div>

                <div class="episode-item" data-index="2">
                    <div class="episode-progress-fill" id="progress-2"></div>
                    <div class="episode-info">
                        <img src="/assets/player/playpeq.png" class="icon-btn-small" id="icon-ep-2" alt="play" onclick="onSmallIconClick(event, 2)">
                        <span>3. Meditación ante la adversidad</span>
                    </div>
                    <span class="episode-duration">5:21</span>
                </div>

                <div class="episode-item" data-index="3">
                    <div class="episode-progress-fill" id="progress-3"></div>
                    <div class="episode-info">
                        <img src="/assets/player/playpeq.png" class="icon-btn-small" id="icon-ep-3" alt="play" onclick="onSmallIconClick(event, 3)">
                        <span>4. Un Estado mental superior</span>
                    </div>
                    <span class="episode-duration">2:58</span>
                </div>

                <div class="episode-item" data-index="4">
                    <div class="episode-progress-fill" id="progress-4"></div>
                    <div class="episode-info">
                        <img src="/assets/player/playpeq.png" class="icon-btn-small" id="icon-ep-4" alt="play" onclick="onSmallIconClick(event, 4)">
                        <span>5. La cumbre de la meditación</span>
                    </div>
                    <span class="episode-duration">5:21</span>
                </div>

                <div class="episode-item" data-index="5">
                    <div class="episode-progress-fill" id="progress-5"></div>
                    <div class="episode-info">
                        <img src="/assets/player/playpeq.png" class="icon-btn-small" id="icon-ep-5" alt="play" onclick="onSmallIconClick(event, 5)">
                        <span>6. Transformación del cerebro</span>
                    </div>
                    <span class="episode-duration">5:09</span>
                </div>

                <div class="episode-item" data-index="6">
                    <div class="episode-progress-fill" id="progress-6"></div>
                    <div class="episode-info">
                        <img src="/assets/player/playpeq.png" class="icon-btn-small" id="icon-ep-6" alt="play" onclick="onSmallIconClick(event, 6)">
                        <span>7. Sobre Mindfulness</span>
                    </div>
                    <span class="episode-duration">5:56</span>
                </div>

            </div>

            <!-- Controles -->
            <div class="controls-bar">
                <div class="volume-container">
                    <svg class="volume-icon" id="volIcon" viewBox="0 0 24 24" onclick="toggleMute()">
                        <path id="volIconPath" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                    <div class="volume-bar" id="volumeBar">
                        <div class="volume-track">
                            <div class="volume-fill" id="volumeFill">
                                <div class="volume-knob"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="controls-buttons">
                    <button class="btn-img-control" onclick="prevTrack()">
                        <img src="/assets/player/atras.png" alt="Atrás" class="img-nav">
                    </button>
                    
                    <button class="btn-img-control" id="playBtnBtn" onclick="togglePlay()">
                        <div class="play-glow-effect"></div>
                        <img src="/assets/player/play.png" id="mainPlayImg" alt="Play" class="img-main-play">
                    </button>

                    <button class="btn-img-control" onclick="nextTrack()">
                        <img src="/assets/player/delante.png" alt="Siguiente" class="img-nav">
                    </button>
                </div>
            </div>
        </div>

        <div class="footer-branding">
            <img src="/assets/player/micro.png" alt="Dharma Eterno" class="micro-img">
        </div>
    </div>

    <script>
        const tracks = [
            "/podcast/audio/1-el-comienzo-del-camino.mp3",
            "/podcast/audio/2-la-meditacion-en-la-vida-real.mp3",
            "/podcast/audio/3-meditacion-ante-la-adversidad.mp3",
            "/podcast/audio/4-un-estado-mental-superior.mp3",
            "/podcast/audio/5-la-cumbre-de-la-meditacion-vida-del-buda.mp3",
            "/podcast/audio/6-transformacion-del-cerebro.mp3",
            "/podcast/audio/7-sobre-mindfulness.mp3"
        ];

        const imgPlayBig = "/assets/player/play.png";
        const imgPauseBig = "/assets/player/pause.png";
        const imgPlaySmall = "/assets/player/playpeq.png";
        const imgPauseSmall = "/assets/player/pausepeq.png";

        let currentTrackIndex = 0;
        let lastVolume = 1;
        let isDraggingVolume = false;
        let isSeekingAudio = false;

        const audio = document.getElementById('mainAudio');
        const mainPlayImg = document.getElementById('mainPlayImg');
        const playBtnBtn = document.getElementById('playBtnBtn');
        const playerWrapper = document.getElementById('playerWrapper');
        const volumeFill = document.getElementById('volumeFill');
        const volumeBar = document.getElementById('volumeBar');
        const volIconPath = document.getElementById('volIconPath');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        function playEpisode(index) {
            if (currentTrackIndex !== index) {
                currentTrackIndex = index;
                audio.src = tracks[currentTrackIndex];
                updateActiveUI();
            }
            audio.play();
        }

        function onSmallIconClick(event, index) {
            event.stopPropagation(); // Evita que afecte a la barra de avance

            if (index === currentTrackIndex) {
                togglePlay();
            } else {
                playEpisode(index);
            }
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            audio.src = tracks[currentTrackIndex];
            audio.play();
            updateActiveUI();
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            audio.src = tracks[currentTrackIndex];
            audio.play();
            updateActiveUI();
        }

        function updateUIState(isPlaying) {
            mainPlayImg.src = isPlaying ? imgPauseBig : imgPlayBig;

            if (isPlaying) {
                playerWrapper.classList.add('playing');
                playBtnBtn.classList.remove('trigger-flash');
                void playBtnBtn.offsetWidth;
                playBtnBtn.classList.add('trigger-flash');
            } else {
                playerWrapper.classList.remove('playing');
                playBtnBtn.classList.remove('trigger-flash');
            }

            for (let i = 0; i < tracks.length; i++) {
                const icon = document.getElementById(`icon-ep-${i}`);
                if (icon) {
                    icon.src = (i === currentTrackIndex && isPlaying) ? imgPauseSmall : imgPlaySmall;
                }
            }
        }

        function updateActiveUI() {
            const items = document.querySelectorAll('.episode-item');
            items.forEach((item, idx) => {
                const progressFill = document.getElementById(`progress-${idx}`);
                if (idx === currentTrackIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                    if(progressFill) progressFill.style.width = '0%';
                }
            });
        }

        audio.ontimeupdate = function() {
            if (audio.duration && !isSeekingAudio) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                const activeProgress = document.getElementById(`progress-${currentTrackIndex}`);
                if (activeProgress) {
                    activeProgress.style.width = percentage + '%';
                }
            }
        };

        /* AVANCE / SEEEKING EN LA BARRA DEL EPISODIO */
        function seekAudioFromEvent(e, itemElement) {
            const index = parseInt(itemElement.getAttribute('data-index'));
            
            if (index !== currentTrackIndex) {
                playEpisode(index);
            }

            const rect = itemElement.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const offsetX = clientX - rect.left;
            const percentage = Math.max(0, Math.min(1, offsetX / rect.width));

            if (audio.duration) {
                audio.currentTime = percentage * audio.duration;
                const activeProgress = document.getElementById(`progress-${index}`);
                if (activeProgress) {
                    activeProgress.style.width = (percentage * 100) + '%';
                }
            }
        }

        const episodeItems = document.querySelectorAll('.episode-item');

        episodeItems.forEach(item => {
            // Eventos Ratón
            item.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('icon-btn-small')) return;
                isSeekingAudio = true;
                seekAudioFromEvent(e, item);
            });

            // Eventos Táctiles (Móviles / Tablets)
            item.addEventListener('touchstart', (e) => {
                if (e.target.classList.contains('icon-btn-small')) return;
                isSeekingAudio = true;
                seekAudioFromEvent(e, item);
            }, { passive: true });
        });

        window.addEventListener('mousemove', (e) => {
            if (isSeekingAudio) {
                const activeItem = document.querySelector('.episode-item.active');
                if (activeItem) seekAudioFromEvent(e, activeItem);
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isSeekingAudio) {
                const activeItem = document.querySelector('.episode-item.active');
                if (activeItem) seekAudioFromEvent(e, activeItem);
            }
        }, { passive: true });

        window.addEventListener('mouseup', () => { isSeekingAudio = false; });
        window.addEventListener('touchend', () => { isSeekingAudio = false; });

        /* Slider de Volumen */
        function updateVolumeFromEvent(e) {
            const rect = volumeBar.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const offsetX = clientX - rect.left;
            const newVol = Math.max(0, Math.min(1, offsetX / rect.width));
            
            audio.volume = newVol;
            volumeFill.style.width = (newVol * 100) + '%';
            updateVolumeIcon(newVol);
        }

        volumeBar.addEventListener('mousedown', (e) => {
            isDraggingVolume = true;
            updateVolumeFromEvent(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDraggingVolume) updateVolumeFromEvent(e);
        });

        window.addEventListener('mouseup', () => { isDraggingVolume = false; });

        volumeBar.addEventListener('touchstart', (e) => {
            isDraggingVolume = true;
            updateVolumeFromEvent(e);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (isDraggingVolume) updateVolumeFromEvent(e);
        }, { passive: true });

        window.addEventListener('touchend', () => { isDraggingVolume = false; });

        function toggleMute() {
            if (audio.volume > 0) {
                lastVolume = audio.volume;
                audio.volume = 0;
                volumeFill.style.width = '0%';
                updateVolumeIcon(0);
            } else {
                audio.volume = lastVolume || 1;
                volumeFill.style.width = (audio.volume * 100) + '%';
                updateVolumeIcon(audio.volume);
            }
        }

        function updateVolumeIcon(vol) {
            if (vol === 0) {
                volIconPath.setAttribute('d', 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z');
            } else {
                volIconPath.setAttribute('d', 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z');
            }
        }

        audio.addEventListener('play', () => updateUIState(true));
        audio.addEventListener('pause', () => updateUIState(false));

        audio.addEventListener('ended', () => {
            nextTrack();
        });
    </script>

<!-- Botón volver (añadido al unir la app) -->
<style>
.de-back{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:100000;width:46px;height:46px;border-radius:50%;
display:flex;align-items:center;justify-content:center;text-decoration:none;color:#f6dc9a;background:rgba(18,8,32,.62);
border:1.5px solid rgba(246,220,154,.75);box-shadow:0 4px 16px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
-webkit-tap-highlight-color:transparent;transition:transform .2s,background .2s}
.de-back:active{transform:scale(.92);background:rgba(18,8,32,.85)}
.de-back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
</style>
<a class="de-back" href="/" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
</body>
</html>
